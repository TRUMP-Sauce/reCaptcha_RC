<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natawayk Verify - 后台管理</title>
    <link rel="icon" href="LOGO.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-dashboard">
        <!-- 侧边栏 -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <img src="LOGO.png" alt="Natawayk Verify" class="admin-sidebar-logo">
                <div>
                    <h2>Natawayk Verify</h2>
                    <span>后台管理</span>
                </div>
            </div>
            <nav class="admin-nav">
                <a href="#" class="admin-nav-item active" data-page="dashboard">仪表盘</a>
                <a href="#" class="admin-nav-item" data-page="config">系统配置</a>
                <a href="#" class="admin-nav-item" data-page="logs">验证日志</a>
            </nav>
            <div class="admin-sidebar-footer">
                <span class="admin-user" id="adminUser">admin</span>
                <button class="btn btn-outline btn-sm" id="logoutBtn">退出</button>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="admin-main">
            <!-- 仪表盘 -->
            <div class="admin-page active" id="page-dashboard">
                <h2>仪表盘</h2>
                <div class="admin-stats-grid" id="statsGrid">
                    <div class="stat-card"><div class="stat-label">今日验证</div><div class="stat-value">-</div></div>
                    <div class="stat-card"><div class="stat-label">今日通过</div><div class="stat-value">-</div></div>
                    <div class="stat-card"><div class="stat-label">今日通过率</div><div class="stat-value">-</div></div>
                    <div class="stat-card"><div class="stat-label">总验证次数</div><div class="stat-value">-</div></div>
                    <div class="stat-card"><div class="stat-label">总通过率</div><div class="stat-value">-</div></div>
                    <div class="stat-card"><div class="stat-label">平均响应(ms)</div><div class="stat-value">-</div></div>
                </div>
                <div class="card" id="typeStats" style="margin-top:20px;">
                    <h3>各类型统计（今日）</h3>
                    <div id="typeStatsContent">加载中...</div>
                </div>
            </div>

            <!-- 系统配置 -->
            <div class="admin-page" id="page-config" style="display:none;">
                <h2>系统配置</h2>
                <div class="card">
                    <form id="configForm">
                        <div class="form-group">
                            <label>默认验证类型</label>
                            <select id="cfg_captcha_type">
                                <option value="slider">滑块拼图</option>
                                <option value="click">点选定位</option>
                                <option value="math">数学计算</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>默认难度</label>
                            <select id="cfg_difficulty">
                                <option value="easy">简单</option>
                                <option value="normal">普通</option>
                                <option value="hard">困难</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>滑块容差 (px)</label>
                            <input type="number" id="cfg_slider_tolerance" min="1" max="20">
                        </div>
                        <div class="form-group">
                            <label>点选容差 (px)</label>
                            <input type="number" id="cfg_click_tolerance" min="10" max="100">
                        </div>
                        <div class="form-group">
                            <label>会话过期时间 (秒)</label>
                            <input type="number" id="cfg_session_expire" min="60" max="3600">
                        </div>
                        <button type="submit" class="btn btn-primary">保存配置</button>
                    </form>
                    <div id="configMsg" class="auth-message"></div>
                </div>
            </div>

            <!-- 验证日志 -->
            <div class="admin-page" id="page-logs" style="display:none;">
                <h2>验证日志</h2>
                <div class="card">
                    <div class="log-filters">
                        <select id="logTypeFilter">
                            <option value="">全部类型</option>
                            <option value="slider">滑块拼图</option>
                            <option value="click">点选定位</option>
                            <option value="math">数学计算</option>
                        </select>
                        <select id="logResultFilter">
                            <option value="">全部结果</option>
                            <option value="verified">通过</option>
                            <option value="failed">失败</option>
                        </select>
                    </div>
                    <div class="log-table-wrap">
                        <table class="log-table">
                            <thead>
                                <tr>
                                    <th>时间</th>
                                    <th>类型</th>
                                    <th>用户答案</th>
                                    <th>正确答案</th>
                                    <th>结果</th>
                                    <th>IP</th>
                                    <th>响应(ms)</th>
                                </tr>
                            </thead>
                            <tbody id="logTableBody">
                                <tr><td colspan="7">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="log-pagination" id="logPagination"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const TOKEN = localStorage.getItem('admin_token');
        const USERNAME = localStorage.getItem('admin_username');

        if (!TOKEN) { window.location.href = 'admin-login.html'; }

        document.getElementById('adminUser').textContent = USERNAME || 'admin';

        const API = (url, opts = {}) => fetch(url, {
            ...opts,
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN, ...opts.headers }
        }).then(r => r.json());

        // 导航切换
        document.querySelectorAll('.admin-nav-item').forEach(item => {
            item.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelectorAll('.admin-nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.admin-page').forEach(p => { p.style.display = 'none'; p.classList.remove('active'); });
                const page = document.getElementById('page-' + this.dataset.page);
                page.style.display = 'block';
                page.classList.add('active');
                if (this.dataset.page === 'dashboard') loadDashboard();
                if (this.dataset.page === 'config') loadConfig();
                if (this.dataset.page === 'logs') loadLogs();
            });
        });

        // 退出
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_username');
            window.location.href = 'admin-login.html';
        });

        // 加载仪表盘
        async function loadDashboard() {
            try {
                const data = await API('api/admin/stats.php');
                if (data.code !== 200) throw new Error(data.message);
                const d = data.data;
                const stats = document.getElementById('statsGrid').children;
                stats[0].querySelector('.stat-value').textContent = d.today.total;
                stats[1].querySelector('.stat-value').textContent = d.today.passed;
                stats[2].querySelector('.stat-value').textContent = d.today.pass_rate + '%';
                stats[3].querySelector('.stat-value').textContent = d.total.total;
                stats[4].querySelector('.stat-value').textContent = d.total.pass_rate + '%';
                stats[5].querySelector('.stat-value').textContent = d.avg_response_time_ms;

                // 类型统计
                let html = '<table class="log-table"><thead><tr><th>类型</th><th>总次数</th><th>通过</th><th>通过率</th></tr></thead><tbody>';
                d.by_type.forEach(t => {
                    const rate = t.total > 0 ? Math.round((t.passed / t.total) * 100) : 0;
                    html += `<tr><td>${t.captcha_type}</td><td>${t.total}</td><td>${t.passed}</td><td>${rate}%</td></tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('typeStatsContent').innerHTML = html;
            } catch (e) {
                console.error(e);
            }
        }

        // 加载配置
        async function loadConfig() {
            try {
                const data = await API('api/admin/config.php');
                if (data.code !== 200) throw new Error(data.message);
                const s = data.data.settings;
                document.getElementById('cfg_captcha_type').value = s.captcha_type || 'slider';
                document.getElementById('cfg_difficulty').value = s.difficulty || 'normal';
                document.getElementById('cfg_slider_tolerance').value = s.slider_tolerance || 5;
                document.getElementById('cfg_click_tolerance').value = s.click_tolerance || 30;
                document.getElementById('cfg_session_expire').value = s.session_expire || 300;
            } catch (e) {
                console.error(e);
            }
        }

        // 保存配置
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('configMsg');
            try {
                const data = await API('api/admin/config.php', {
                    method: 'POST',
                    body: JSON.stringify({
                        captcha_type: document.getElementById('cfg_captcha_type').value,
                        difficulty: document.getElementById('cfg_difficulty').value,
                        slider_tolerance: document.getElementById('cfg_slider_tolerance').value,
                        click_tolerance: document.getElementById('cfg_click_tolerance').value,
                        session_expire: document.getElementById('cfg_session_expire').value,
                    })
                });
                if (data.code === 200) {
                    msg.textContent = '配置保存成功';
                    msg.className = 'auth-message success';
                } else {
                    msg.textContent = data.message;
                    msg.className = 'auth-message error';
                }
            } catch (e) {
                msg.textContent = '保存失败';
                msg.className = 'auth-message error';
            }
        });

        // 加载日志
        let logPage = 1;
        async function loadLogs(page = 1) {
            logPage = page;
            const type = document.getElementById('logTypeFilter').value;
            const result = document.getElementById('logResultFilter').value;
            try {
                const data = await API(`api/admin/logs.php?page=${page}&limit=20&type=${type}&result=${result}`);
                if (data.code !== 200) throw new Error(data.message);
                const d = data.data;
                let html = '';
                d.logs.forEach(log => {
                    const resultClass = log.result === 'verified' ? 'log-pass' : 'log-fail';
                    const resultText = log.result === 'verified' ? '通过' : '失败';
                    html += `<tr>
                        <td>${log.created_at}</td>
                        <td>${log.captcha_type}</td>
                        <td>${log.user_answer}</td>
                        <td>${log.correct_answer}</td>
                        <td class="${resultClass}">${resultText}</td>
                        <td>${log.ip_address}</td>
                        <td>${log.response_time_ms}</td>
                    </tr>`;
                });
                document.getElementById('logTableBody').innerHTML = html || '<tr><td colspan="7">暂无数据</td></tr>';

                // 分页
                let pagHtml = '';
                for (let i = 1; i <= d.pagination.total_pages; i++) {
                    pagHtml += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="loadLogs(${i})">${i}</button>`;
                }
                document.getElementById('logPagination').innerHTML = pagHtml;
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('logTypeFilter').addEventListener('change', () => loadLogs(1));
        document.getElementById('logResultFilter').addEventListener('change', () => loadLogs(1));

        // 初始加载
        loadDashboard();
    </script>
</body>
</html>
