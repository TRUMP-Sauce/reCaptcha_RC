<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natawayk Verify - 后台管理登录</title>
    <link rel="icon" href="LOGO.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-card">
            <img src="LOGO.png" alt="Natawayk Verify" class="admin-login-logo">
            <h1>Natawayk Verify</h1>
            <p class="admin-login-subtitle">后台管理系统</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="Administrator" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary">登 录</button>
                <div id="loginMsg" class="auth-message"></div>
            </form>
            <div class="admin-login-footer">
                <span>默认账号: Administrator / Administrator@9000</span>
                <a href="index.html">返回演示</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('loginMsg');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            msg.textContent = '';
            msg.className = 'auth-message';

            try {
                const resp = await fetch('api/auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();
                if (data.code === 200) {
                    localStorage.setItem('admin_token', data.data.token);
                    localStorage.setItem('admin_username', data.data.username);
                    msg.textContent = '登录成功，跳转中...';
                    msg.className = 'auth-message success';
                    setTimeout(() => { window.location.href = 'admin.html'; }, 500);
                } else {
                    msg.textContent = data.message;
                    msg.className = 'auth-message error';
                }
            } catch (e) {
                msg.textContent = '网络错误';
                msg.className = 'auth-message error';
            }
        });
    </script>
</body>
</html>
